[package]
name = "rust-embed"
version = "8.12.0"
edition = "2018"
rust-version = "1.80.0"
license = "MIT"
publish = false
description = "Rust Custom Derive Macro which loads files into the rust binary"
repository = "https://pyrossh.dev/repos/rust-embed"

[dependencies]
walkdir = "2.3.2"
rust-embed-impl = { version = "=8.12.0", path = "../rust-embed-impl-8.12.0" }
rust-embed-utils = "=8.12.0"
include-flate = { version = "0.3", optional = true }

[features]
compression = ["rust-embed-impl/compression", "rust-embed-utils/compression", "include-flate"]
debug-embed = ["rust-embed-impl/debug-embed", "rust-embed-utils/debug-embed"]
deterministic-timestamps = ["rust-embed-impl/deterministic-timestamps"]
