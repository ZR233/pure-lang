name: pure_studio_flutter
description: Pure Studio Flutter desktop client.
publish_to: 'none'

# Release Please updates this stable SemVer in its reviewed Release PR.
# Windows uses these major, minor, and patch components for product and file versions.
version: 1.0.1 # x-release-please-version

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  file_picker: ^11.0.2
  flutter_rust_bridge: ^2.12.0
  gpt_markdown: 1.1.8
  intl: any
  freezed_annotation: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5

flutter:
  generate: true
  uses-material-design: true

flutter_rust_bridge:
  rust_root: rust/
  rust_input: crate::api
  dart_output: lib/src/rust
  rust_output: rust/src/frb_generated.rs
