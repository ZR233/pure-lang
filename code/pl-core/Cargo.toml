[package]
name = "pl-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:sea-orm", "dep:fs4", "dep:url"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
sea-orm = { workspace = true, optional = true }
fs4 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` (dev only) provides the paused clock (`start_paused` / `time::advance`) the window
# tests use to prove the coalescing deadline is fixed deterministically instead of with real sleeps.
# Production dependencies keep tokio's workspace feature set unchanged.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "sqlite_persistence"
path = "tests/sqlite_persistence.rs"
required-features = ["sqlite"]
