[package]
name = "pl-studio-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
live-tests = []

[dependencies]
pl-core = { workspace = true }
pl-protocol = { workspace = true }
pl-trace = { workspace = true }
pl-model = { workspace = true }
pl-lsp = { workspace = true }
anyhow = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }
url = { workspace = true }
keyring = { workspace = true }
tempfile = { workspace = true }
minisign-verify = { workspace = true }
fs4 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "transport-streamable-http-server",
] }

[[test]]
name = "task_live"
path = "tests/task_live.rs"
required-features = ["live-tests"]

[[test]]
name = "lsp_live"
path = "tests/lsp_live.rs"
required-features = ["live-tests"]
