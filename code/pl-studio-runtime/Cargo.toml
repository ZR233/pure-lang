toml = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }
url = { workspace = true }
keyring = { workspace = true }
