[package]
name = "pl-studio-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
embedded-remote-helpers = []
live-tests = []

[dependencies]
pl-remote-helper = { workspace = true }
pl-model = { workspace = true }
pl-core = { workspace = true, features = ["sqlite"] }
pl-tool = { workspace = true }
pl-protocol = { workspace = true }
pl-trace = { workspace = true }
pl-lsp = { workspace = true }
anyhow = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }
url = { workspace = true }
keyring = { workspace = true }
tempfile = { workspace = true }
minisign-verify = { workspace = true }
fs4 = { workspace = true }
rust-embed = { workspace = true }
dunce = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "workflow_live"
path = "tests/workflow_live.rs"
required-features = ["live-tests"]

[[test]]
name = "lsp_live"
path = "tests/lsp_live.rs"
required-features = ["live-tests"]

[[example]]
name = "model_accounting_live"
required-features = ["live-tests"]

[[test]]
name = "apply_patch_live"
path = "tests/apply_patch_live.rs"
required-features = ["live-tests"]

[[test]]
name = "trace_live"
path = "tests/trace_live.rs"
required-features = ["live-tests"]

[[test]]
name = "context_compaction_live"
path = "tests/context_compaction_live.rs"
required-features = ["live-tests"]

[[test]]
name = "prompt_cache_live"
path = "tests/prompt_cache_live.rs"
required-features = ["live-tests"]
