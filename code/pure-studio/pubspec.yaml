name: pure_studio
description: Pure Studio desktop application.
publish_to: 'none'

# Release Please updates this stable SemVer in its reviewed Release PR.
# Windows uses these major, minor, and patch components for product and file versions.
version: 2.0.0 # x-release-please-version

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  file_picker: ^12.0.0
  flutter_rust_bridge: 2.12.0
  gpt_markdown: 1.1.8
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.6
dev_dependencies:
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8

flutter:
  generate: true
  uses-material-design: true

flutter_rust_bridge:
  rust_root: rust/
  rust_input: crate::api
  dart_output: lib/src/rust
  rust_output: rust/src/frb_generated.rs
