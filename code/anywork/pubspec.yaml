name: anywork
description: anywork desktop application.
publish_to: 'none'

# Release Please updates this stable SemVer in its reviewed Release PR.
# Windows uses these major, minor, and patch components for product and file versions.
version: 6.19.0 # x-release-please-version

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  anywork_client:
    path: ../anywork_client
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  flutter_rust_bridge: 2.13.0
  gpt_markdown: 1.3.4
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.7
  desktop_drop: ^0.9.1
  pasteboard: ^0.5.0
  flutter_svg: ^2.3.0
  scrollview_observer: 1.27.3
  flutter_chat_core: ^2.9.1
  flutter_chat_ui: ^2.12.0
dependency_overrides:
  cross_cache:
    path: packages/cross_cache
dev_dependencies:
  analyzer: 14.5.0
  ffi: ^2.2.0
  win32: ^6.4.0
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/anywork-app-icon.png
    - assets/branding/anywork-startup-cat.webp
    - assets/branding/anywork-startup-cat.png
    - assets/provider-logos/

flutter_rust_bridge:
  rust_root: rust/
  rust_input: crate::api
  dart_output: lib/src/rust
  rust_output: rust/src/frb_generated.rs
