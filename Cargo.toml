[workspace]
members = [
    "code/pl-protocol",
    "code/pl-trace",
    "code/pl-model",
    "code/pl-lsp",
    "code/pl-output",
    "code/pl-patch",
    "code/pl-skill-core",
    "code/pl-core",
    "code/pl-studio-runtime",
    "code/pl-studio-server",
    "code/pure-studio/rust",
    "xtask",
]
resolver = "3"
exclude = [
    "third_party/rust-embed-8.12.0",
    "third_party/rust-embed-impl-8.12.0",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-webpki-roots"] }
tower = "0.5.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
serde_norway = "0.9"
rust-embed = { version = "=8.12.0", path = "third_party/rust-embed-8.12.0", features = [
    "compression",
    "debug-embed",
    "deterministic-timestamps",
] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4.1.6"
tempfile = "3"
ignore = "0.4"
gray_matter = "0.3.2"
time = { version = "0.3", features = ["local-offset"] }
base64 = "0.22"
which = "8"
dunce = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
axum = "0.8"
fs4 = "=1.1.0"
utoipa = "=5.5.0"
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum", "vendored", "debug-embed"] }
rmcp = { version = "=3.1.2", default-features = false }
process-wrap = { version = "9.0.0", features = ["tokio1"] }
lsp-server = "0.10"
lsp-types = "0.97.0"
async-openai = { version = "0.41.1", default-features = false, features = [
    "rustls",
    "responses",
    "chat-completion",
    "byot",
] }
secrecy = "0.10"
toml = "1.1.3"
pretty_assertions = "1.4.1"
# SQLite does not need SQLx TLS; enabling it would add rustls ring beside reqwest's AWS-LC provider.
sea-orm = { version = "2.0.1", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlx-sqlite",
] }
sha2 = "0.10"
semver = "1"
url = "2"
minisign-verify = "0.2.5"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

pl-protocol = { path = "code/pl-protocol" }
pl-trace = { path = "code/pl-trace" }
pl-lsp = { path = "code/pl-lsp" }
pl-output = { path = "code/pl-output" }
pl-patch = { path = "code/pl-patch" }
pl-skill-core = { path = "code/pl-skill-core" }
pl-core = { path = "code/pl-core" }
pl-studio-runtime = { path = "code/pl-studio-runtime" }
pl-studio-server = { path = "code/pl-studio-server" }
pl-model = { path = "code/pl-model" }
