[workspace]
members = [
    "code/pl-protocol",
    "code/pl-trace",
    "code/pl-model",
    "code/pl-lsp",
    "code/pl-output",
    "code/pl-patch",
    "code/pl-skill-core",
    "code/pl-core",
    "code/pure-studio-flutter/rust",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
include_dir = "0.7"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
bitflags = { version = "2", features = ["serde"] }
base64 = "0.22"
which = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
lsp-types = "0.97.0"
async-openai = { version = "0.40.3", default-features = false, features = [
    "rustls",
    "responses",
    "chat-completion",
    "byot",
] }
secrecy = "0.10"
toml = "0.8"
pretty_assertions = "1.4.1"
sea-orm = { version = "1.1.20", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }

pl-protocol = { path = "code/pl-protocol" }
pl-trace = { path = "code/pl-trace" }
pl-lsp = { path = "code/pl-lsp" }
pl-output = { path = "code/pl-output" }
pl-patch = { path = "code/pl-patch" }
pl-skill-core = { path = "code/pl-skill-core" }
pl-core = { path = "code/pl-core" }
pl-model = { path = "code/pl-model" }
