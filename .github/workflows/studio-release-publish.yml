name: Studio Release Publish

on:
  workflow_call:
    inputs:
      releaseId:
        description: Exact GitHub Release ID created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      releaseId:
        description: Exact GitHub Release ID created by Release Please
        required: true
        type: string

concurrency:
  group: studio-stable-release-publish
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve immutable Release source
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      releaseId: ${{ steps.release.outputs.releaseId }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Release ID, tag, version, and commit
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.releaseId }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Studio publisher must run from main, not $env:GITHUB_REF"
          }
          if ($env:GITHUB_REPOSITORY -cne 'ZR233/pure-lang') {
            throw "Studio publisher cannot run for repository $env:GITHUB_REPOSITORY"
          }
          if ($env:RELEASE_ID -notmatch '^[1-9]\d*$') {
            throw "Release ID must be a positive decimal integer: $env:RELEASE_ID"
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read GitHub Release $env:RELEASE_ID"
          }
          $expectedApiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $expectedUploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets{?name,label}"
          if (
            [string]$release.id -cne $env:RELEASE_ID -or
            $release.url -cne $expectedApiUrl -or
            $release.upload_url -cne $expectedUploadUrl
          ) {
            throw "Release $env:RELEASE_ID belongs to an unexpected repository or API resource"
          }
          if ($release.prerelease) {
            throw "Release $env:RELEASE_ID must not be a prerelease"
          }
          if ($release.tag_name -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag must be stable v-prefixed SemVer: $($release.tag_name)"
          }
          $version = $Matches['version']
          $tag = "v$version"
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          Assert-StudioReleasePageUrl `
            -Release $release `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $tag

          git fetch --force origin `
            'refs/heads/main:refs/remotes/origin/main' `
            "refs/tags/${tag}:refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch main and immutable tag $tag"
          }
          $sha = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw "Failed to resolve commit for tag $tag"
          }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag commit $sha is not contained in origin/main"
          }
          if ($release.target_commitish -cne 'main' -and $release.target_commitish -cne $sha) {
            throw "Release target $($release.target_commitish) does not identify main or tag commit $sha"
          }

          $rootVersion = (git show "${sha}:studio-version.txt").Trim()
          if ($LASTEXITCODE -ne 0 -or $rootVersion -cne $version) {
            throw "Tag $tag does not contain matching studio-version.txt"
          }
          $pubspec = git show "${sha}:code/pure-studio/pubspec.yaml"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag does not contain the Flutter pubspec"
          }
          $pubspecMatches = [regex]::Matches(
            ($pubspec -join "`n"),
            '(?m)^version:\s*(?<version>\S+)\s+#\s*x-release-please-version\s*$'
          )
          if ($pubspecMatches.Count -ne 1 -or $pubspecMatches[0].Groups['version'].Value -cne $version) {
            throw "Tag $tag does not contain the matching annotated Flutter version"
          }
          $manifest = (git show "${sha}:.release-please-manifest.json") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $manifest.'.' -cne $version) {
            throw "Tag $tag does not contain the matching Release Please manifest version"
          }

          $expectedNames = @(Get-StudioReleaseAssetNames -Version $version)
          Assert-StudioReleaseRemoteAssets `
            -Release $release `
            -ExpectedNames $expectedNames `
            -RequireComplete:(-not [bool]$release.draft)

          "draft=$($release.draft.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "releaseId=$env:RELEASE_ID" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  helper:
    name: Build and sign Linux remote helpers
    needs: resolve
    if: needs.resolve.outputs.draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust cross targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install pinned Zig and cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.14.1.tar.xz"
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz \
            --output "$archive"
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  '"$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/zig-0.14.1"
          mkdir -p "$tool_dir"
          tar -xJf "$archive" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.3 --locked

      - name: Build all remote helper architectures
        env:
          PURE_REMOTE_HELPER_BUILDER: zigbuild
        run: cargo xtask build-remote-helper --all-targets

      - name: Install pinned Minisign
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$archive"
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  '"$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/minisign-0.12"
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" minisign-linux/x86_64/minisign
          chmod 755 "$tool_dir/minisign-linux/x86_64/minisign"
          echo "$tool_dir/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - name: Sign and verify remote helpers
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MINISIGN_SECRET_KEY" || -z "$MINISIGN_PASSWORD" ]]; then
            echo 'MINISIGN_SECRET_KEY and MINISIGN_PASSWORD secrets are required' >&2
            exit 1
          fi
          secret_key="$RUNNER_TEMP/pure-studio.key"
          trap 'rm -f "$secret_key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$secret_key"
          for target in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            helper="dist/remote-helper/$target/pl-remote-helper"
            printf '%s\r\n' "$MINISIGN_PASSWORD" | minisign \
              -S -s "$secret_key" -m "$helper" -x "$helper.minisig" \
              -t "Pure Studio $RELEASE_VERSION"
            minisign -V -p code/pl-studio-runtime/src/updater/pure-studio.pub \
              -m "$helper" -x "$helper.minisig"
          done

      - name: Attest aarch64 helper provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/remote-helper/aarch64-unknown-linux-musl/pl-remote-helper

      - name: Attest x86_64 helper provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/remote-helper/x86_64-unknown-linux-musl/pl-remote-helper

      - name: Preserve signed remote helpers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-remote-helper-${{ needs.resolve.outputs.releaseId }}
          path: dist/remote-helper/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build:
    name: Build and sign Windows x64
    needs:
      - resolve
      - helper
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PURE_REMOTE_HELPER_RELEASE_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Download signed remote helpers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-remote-helper-${{ needs.resolve.outputs.releaseId }}
          path: dist/remote-helper

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify Rust workspace
        env:
          API_KEY_DEEPSEEK: ""
          API_KEY_OPENAI: ""
          API_KEY_ZHIPU: ""
        shell: pwsh
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Install FRB code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Verify Flutter application
        run: cargo xtask verify-gui

      - name: Install release tools
        shell: pwsh
        run: |
          $isccCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $isccCandidates |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if ($null -eq $iscc) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Inno Setup 6.4.3 (choco exit $LASTEXITCODE)"
            }
            $iscc = $isccCandidates |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if ($null -eq $iscc) {
            throw 'Inno Setup 6 compiler was not found after installation'
          }
          $isccVersion = [Version](Get-Item -LiteralPath $iscc).VersionInfo.FileVersion
          if ($isccVersion -eq [Version]'0.0.0.0') {
            Write-Warning "Inno Setup at $iscc does not expose meaningful file-version metadata; package staging will validate the compiler"
          } elseif ($isccVersion.Major -ne 6 -or $isccVersion -lt [Version]'6.4.3') {
            throw "Unsupported Inno Setup compiler version $isccVersion at $iscc"
          } else {
            Write-Output "Using Inno Setup compiler $isccVersion at $iscc"
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479') {
            throw "Unexpected Minisign archive SHA-256: $actualHash"
          }
          $toolDir = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          $minisign = Join-Path $toolDir 'minisign-win64\x86_64\minisign.exe'
          if (-not (Test-Path -LiteralPath $minisign -PathType Leaf)) {
            throw 'x86_64 minisign.exe not found in verified archive'
          }
          (Split-Path -Parent $minisign) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Materialize optional Authenticode certificate
        shell: pwsh
        env:
          AUTHENTICODE_CERTIFICATE_BASE64: ${{ secrets.AUTHENTICODE_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_CERTIFICATE_BASE64)) {
            $certificate = Join-Path $env:RUNNER_TEMP 'pure-studio-authenticode.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:AUTHENTICODE_CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe not found' }
            "WINDOWS_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Stage Windows packages
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.AUTHENTICODE_CERTIFICATE_PASSWORD }}
        run: cargo xtask release-gui stage --version $env:RELEASE_VERSION

      - name: Package matching Windows symbols
        shell: pwsh
        run: |
          $symbolsDir = Join-Path $env:RUNNER_TEMP "pure-studio-symbols-$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path $symbolsDir | Out-Null
          $roots = @(
            (Join-Path $env:GITHUB_WORKSPACE 'dist/pure-studio-release'),
            (Join-Path $env:GITHUB_WORKSPACE 'target/release'),
            (Join-Path $env:GITHUB_WORKSPACE 'code/pure-studio/build/windows/x64/rust-target/release')
          )
          $copied = 0
          for ($index = 0; $index -lt $roots.Count; $index += 1) {
            $root = $roots[$index]
            if (-not (Test-Path -LiteralPath $root -PathType Container)) {
              continue
            }
            $target = Join-Path $symbolsDir "source-$index"
            New-Item -ItemType Directory -Path $target | Out-Null
            Get-ChildItem -LiteralPath $root -Filter *.pdb -File -Recurse |
              ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $target $_.Name)
                $copied += 1
              }
          }
          if ($copied -eq 0) {
            throw 'No matching Windows PDB files were produced'
          }
          @{
            version = $env:RELEASE_VERSION
            commit = '${{ needs.resolve.outputs.sha }}'
            protocolVersion = 2
            generatedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $symbolsDir 'version-map.json')
          $archive = Join-Path $env:RUNNER_TEMP "Pure-Studio-$env:RELEASE_VERSION-windows-x86_64-symbols.zip"
          Compress-Archive -Path (Join-Path $symbolsDir '*') -DestinationPath $archive
          "SYMBOL_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Remove Authenticode certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH) -and (Test-Path -LiteralPath $env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH -Force
          }

      - name: Materialize Minisign credentials
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY)) {
            throw 'MINISIGN_SECRET_KEY secret is required'
          }
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_PASSWORD)) {
            throw 'MINISIGN_PASSWORD secret is required'
          }
          $minisignKey = Join-Path $env:RUNNER_TEMP 'pure-studio.key'
          Set-Content -LiteralPath $minisignKey -Value $env:MINISIGN_SECRET_KEY -NoNewline
          "MINISIGN_SECRET_KEY_FILE=$minisignKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Finalize and verify signed release
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask release-gui finalize --version $env:RELEASE_VERSION

      - name: Remove Minisign secret key
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY_FILE) -and (Test-Path -LiteralPath $env:MINISIGN_SECRET_KEY_FILE)) {
            Remove-Item -LiteralPath $env:MINISIGN_SECRET_KEY_FILE -Force
          }

      - name: Smoke-test per-user installer
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $installer = Join-Path $releaseDir "Pure-Studio-$env:RELEASE_VERSION-windows-x86_64-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'pure-studio-smoke'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $executable = Join-Path $installDir 'pure_studio.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'Installed executable missing' }
          $productVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith($env:RELEASE_VERSION)) {
            throw "Installed version $productVersion does not match $env:RELEASE_VERSION"
          }
          $uninstallRoots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKCU:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          $uninstall = @(
            foreach ($root in $uninstallRoots) {
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root |
                  Get-ItemProperty |
                  Where-Object {
                    $_.DisplayName -like 'Pure Studio*' -and
                    $_.DisplayVersion -eq $env:RELEASE_VERSION
                  }
              }
            }
          )
          if ($uninstall.Count -ne 1) {
            throw "Expected one per-user uninstall registration for $env:RELEASE_VERSION, found $($uninstall.Count)"
          }
          cargo xtask release-gui verify --version $env:RELEASE_VERSION

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/studio-release/${{ needs.resolve.outputs.version }}/Pure-Studio-${{ needs.resolve.outputs.version }}-windows-x86_64-setup.exe

      - name: Attest portable provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/studio-release/${{ needs.resolve.outputs.version }}/Pure-Studio-${{ needs.resolve.outputs.version }}-windows-x86_64-portable.zip

      - name: Preserve immutable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-release-${{ needs.resolve.outputs.releaseId }}
          path: dist/studio-release/${{ needs.resolve.outputs.version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve matching debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-symbols-${{ needs.resolve.outputs.releaseId }}-${{ needs.resolve.outputs.version }}
          path: ${{ env.SYMBOL_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Reconcile assets and publish draft
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.draft == 'true' && needs.build.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Download immutable release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-release-${{ needs.resolve.outputs.releaseId }}
          path: dist/studio-release/${{ needs.resolve.outputs.version }}

      - name: Verify downloaded artifact
        run: cargo xtask release-gui verify --version $env:RELEASE_VERSION

      - name: Upload only missing identical assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read draft Release $env:RELEASE_ID"
          }
          if (
            [string]$release.id -cne $env:RELEASE_ID -or
            $release.url -cne "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -or
            $release.tag_name -cne $env:RELEASE_TAG -or
            $release.prerelease
          ) {
            throw "Release $env:RELEASE_ID changed identity before asset upload"
          }

          $plan = Get-StudioReleaseAssetPlan `
            -Release $release `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          foreach ($name in $plan.MissingNames) {
            if (-not [bool]$release.draft) {
              throw "Published Release $env:RELEASE_ID cannot receive missing asset $name"
            }
            $path = Join-Path $releaseDir $name
            $escapedName = [Uri]::EscapeDataString($name)
            $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$escapedName"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-WebRequest `
              -Method Post `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $path | Out-Null
            Write-Output "Uploaded missing Release asset $name"
          }

          $reconciled = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to re-read draft Release $env:RELEASE_ID"
          }
          $finalPlan = Get-StudioReleaseAssetPlan `
            -Release $reconciled `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $finalPlan.Complete) {
            throw "Release $env:RELEASE_ID is still missing assets: $($finalPlan.MissingNames -join ', ')"
          }

      - name: Publish complete Release as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Release $env:RELEASE_ID before publication"
          }
          if ($release.draft) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
              -F draft=false `
              -f make_latest=true *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish Release $env:RELEASE_ID"
            }
          }

          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.prerelease -or $published.tag_name -cne $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_ID is not in the expected published state"
          }
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $plan = Get-StudioReleaseAssetPlan `
            -Release $published `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $plan.Complete) {
            throw "Published Release $env:RELEASE_ID failed final asset verification"
          }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$latest.id -cne $env:RELEASE_ID) {
            throw "Release $env:RELEASE_ID was not marked latest"
          }

  verify-existing:
    name: Verify already published Release
    needs: resolve
    if: needs.resolve.outputs.draft == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_ID is not the expected published stable Release"
          }
          $expectedNames = @(Get-StudioReleaseAssetNames -Version $env:RELEASE_VERSION)
          Assert-StudioReleaseRemoteAssets -Release $release -ExpectedNames $expectedNames -RequireComplete

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          foreach ($asset in $release.assets) {
            if ($asset.browser_download_url -cne "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($asset.name)") {
              throw "Release asset $($asset.name) has an unexpected download URL"
            }
            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile (Join-Path $releaseDir $asset.name)
          }
          $plan = Get-StudioReleaseAssetPlan `
            -Release $release `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $plan.Complete) {
            throw "Published Release $env:RELEASE_ID is incomplete"
          }
          cargo xtask release-gui verify --version $env:RELEASE_VERSION

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$latest.id -cne $env:RELEASE_ID) {
            throw "Published Release $env:RELEASE_ID is not latest"
          }
