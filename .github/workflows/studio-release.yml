name: Studio Release

on:
  workflow_dispatch:
    inputs:
      changeType:
        description: Release change type (ignored for a major release)
        required: true
        default: fix
        type: choice
        options:
          - fix
          - feature
      majorRelease:
        description: Publish the next major version
        required: false
        default: false
        type: boolean

concurrency:
  group: studio-stable-release-prepare
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    name: Prepare version commit
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate main and release lock
        id: source
        shell: pwsh
        run: |
          # These probes intentionally use non-zero native exit codes for absent refs.
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (git rev-parse HEAD).Trim()
          $mainRef = @(git ls-remote --heads origin 'refs/heads/main')
          if ($mainRef.Count -ne 1) {
            throw 'Remote main branch is missing or ambiguous'
          }
          $originMain = ($mainRef[0] -split '\s+')[0]
          if ($head -ne $originMain) {
            throw "Workflow source $head is not the current origin/main $originMain"
          }

          git ls-remote --exit-code origin 'refs/heads/studio-release/active' *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'A Studio release is already active. Re-run or finish the existing Studio Release Publish workflow.'
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Failed to inspect the Studio release lock (git exit $LASTEXITCODE)"
          }
          "baseSha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Prepare next Studio version
        id: version
        shell: pwsh
        env:
          CHANGE_TYPE: ${{ inputs.changeType }}
          MAJOR_RELEASE: ${{ inputs.majorRelease }}
        run: |
          if ($env:MAJOR_RELEASE -eq 'true') {
            $bump = 'major'
          } elseif ($env:CHANGE_TYPE -eq 'feature') {
            $bump = 'minor'
          } elseif ($env:CHANGE_TYPE -eq 'fix') {
            $bump = 'patch'
          } else {
            throw "Unsupported change type: $env:CHANGE_TYPE"
          }

          $json = @(cargo xtask release-gui prepare --bump $bump) -join ''
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to prepare the Studio version (cargo exit $LASTEXITCODE)"
          }
          $prepared = $json | ConvertFrom-Json
          if ($prepared.version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "xtask returned an invalid release version: $($prepared.version)"
          }
          if ($prepared.pubspecVersion -ne "$($prepared.version)+$($prepared.buildNumber)") {
            throw 'xtask returned inconsistent Studio version metadata'
          }

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'code/pure-studio-flutter/pubspec.yaml') {
            throw "Version preparation changed an unexpected file set: $($changed -join ', ')"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Prepared Studio version contains whitespace errors'
          }

          "bump=$bump" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($prepared.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "buildNumber=$($prepared.buildNumber)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pubspecVersion=$($prepared.pubspecVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate release immutability
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Missing tags and releases are the expected pre-release state.
          $PSNativeCommandUseErrorActionPreference = $false
          git ls-remote --exit-code origin "refs/tags/v$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag v$env:RELEASE_VERSION already exists"
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Failed to inspect tag v$env:RELEASE_VERSION (git exit $LASTEXITCODE)"
          }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$env:RELEASE_VERSION already exists"
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Failed to inspect Release v$env:RELEASE_VERSION (gh exit $LASTEXITCODE)"
          }

      - name: Commit and lock release source
        id: commit
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- code/pure-studio-flutter/pubspec.yaml
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne 'code/pure-studio-flutter/pubspec.yaml') {
            throw "Unexpected staged file set: $($staged -join ', ')"
          }
          git commit -m "chore(studio): prepare v$env:RELEASE_VERSION"
          $releaseSha = (git rev-parse HEAD).Trim()
          git push origin 'HEAD:refs/heads/studio-release/active'
          "releaseSha=$releaseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Dispatch signed release build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.source.outputs.baseSha }}
          RELEASE_SHA: ${{ steps.commit.outputs.releaseSha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A failed dispatch is handled below so the recovery branch can be preserved.
          $PSNativeCommandUseErrorActionPreference = $false
          gh workflow run studio-release-publish.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref studio-release/active `
            -f "version=$env:RELEASE_VERSION" `
            -f "baseSha=$env:BASE_SHA"
          if ($LASTEXITCODE -eq 0) {
            "Publisher dispatched for Pure Studio v$env:RELEASE_VERSION from $env:RELEASE_SHA." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          @(
            "Publisher dispatch failed for Pure Studio v$env:RELEASE_VERSION.",
            "The protected source remains at studio-release/active ($env:RELEASE_SHA).",
            "Re-run Studio Release Publish with version=$env:RELEASE_VERSION and baseSha=$env:BASE_SHA."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          throw "Failed to dispatch Studio Release Publish for v$env:RELEASE_VERSION; the active release branch was preserved for recovery"
