name: Studio Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: studio-release-please
  cancel-in-progress: false

permissions: {}

jobs:
  inspect:
    name: Inspect active draft
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      hasDraft: ${{ steps.draft.outputs.hasDraft }}
      releaseId: ${{ steps.draft.outputs.releaseId }}
    steps:
      - name: Find resumable stable draft
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Studio Release must run from main, not $env:GITHUB_REF"
          }
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to inspect existing GitHub Releases'
          }
          $drafts = @(
            $releases | Where-Object {
              $_.draft -and
              -not $_.prerelease -and
              $_.tag_name -match '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
            }
          )
          if ($drafts.Count -gt 1) {
            throw "Multiple stable draft Releases require manual resolution: $($drafts.id -join ', ')"
          }
          if ($drafts.Count -eq 0) {
            'hasDraft=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $draft = $drafts[0]
          if ($draft.url -cne "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($draft.id)") {
            throw "Draft Release $($draft.id) belongs to an unexpected repository"
          }
          'hasDraft=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "releaseId=$($draft.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release-please:
    name: Update Release PR
    needs: inspect
    if: needs.inspect.outputs.hasDraft != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      releaseCreated: ${{ steps.release.outputs.release_created }}
      releaseId: ${{ steps.release-id.outputs.releaseId }}
    steps:
      - name: Require Release Please token
        shell: pwsh
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PLEASE_TOKEN)) {
            throw 'RELEASE_PLEASE_TOKEN must be configured before Studio Release can run'
          }

      - name: Create or update Release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Resolve created draft Release ID
        id: release-id
        if: steps.release.outputs.release_created == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release Please returned invalid stable SemVer: $env:RELEASE_VERSION"
          }
          if ($env:RELEASE_TAG -cne "v$env:RELEASE_VERSION") {
            throw "Release Please tag $env:RELEASE_TAG does not match version $env:RELEASE_VERSION"
          }
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Release Please returned invalid commit SHA: $env:RELEASE_SHA"
          }

          $repository = [regex]::Escape($env:GITHUB_REPOSITORY)
          $uploadPattern = "^https://uploads\.github\.com/repos/$repository/releases/(?<id>[1-9]\d*)/assets\{\?name,label\}$"
          $match = [regex]::Match($env:RELEASE_UPLOAD_URL, $uploadPattern)
          if (-not $match.Success) {
            throw "Release Please returned an unexpected upload URL: $env:RELEASE_UPLOAD_URL"
          }
          $releaseId = $match.Groups['id'].Value
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Release $releaseId created by Release Please"
          }
          if (
            [string]$release.id -cne $releaseId -or
            $release.tag_name -cne $env:RELEASE_TAG -or
            -not $release.draft -or
            $release.prerelease
          ) {
            throw "Release Please created an unexpected Release state for $env:RELEASE_TAG"
          }
          "releaseId=$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  dispatch-existing:
    name: Resume draft publisher
    needs: inspect
    if: needs.inspect.outputs.hasDraft == 'true'
    runs-on: windows-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch existing draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.inspect.outputs.releaseId }}
        run: |
          gh workflow run studio-release-publish.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref main `
            -f "releaseId=$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to dispatch Studio publisher for Release $env:RELEASE_ID"
          }
  dispatch-created:
    name: Dispatch new publisher
    needs: release-please
    if: needs.release-please.outputs.releaseCreated == 'true'
    runs-on: windows-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch created draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-please.outputs.releaseId }}
        run: |
          if ($env:RELEASE_ID -notmatch '^[1-9]\d*$') {
            throw "Release Please did not return a valid Release ID: $env:RELEASE_ID"
          }
          gh workflow run studio-release-publish.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref main `
            -f "releaseId=$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to dispatch Studio publisher for Release $env:RELEASE_ID"
          }
