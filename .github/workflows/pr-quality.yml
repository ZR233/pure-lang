name: PR Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust-quality:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  web-quality:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/pure-studio/package-lock.json
      - name: npm ci
        working-directory: code/pure-studio
        run: npm ci
      - name: typecheck
        working-directory: code/pure-studio
        run: npm run typecheck
      - name: build
        working-directory: code/pure-studio
        run: npm run build
